[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "courseware-workflow"
version = "0.1.0"
description = "Turn a semester of courseware into per-lecture notes, scripts and group-work docs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "pdfplumber>=0.10",
    "pymupdf>=1.23",
    "Pillow>=10",
]

[project.scripts]
cw = "cw:main"

[tool.setuptools]
py-modules = ["cw", "web"]
